name: Package & Release Addons

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release version override for manual runs (e.g. v1.9.7)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare changelog & stage full DynamicSuite addon
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          # Extract only the active/latest release section into .release-changelog.md
          # so GitHub Releases never exceed the 125,000-character body limit (HTTP 422),
          # while full CHANGELOG.md remains inside the packaged addon zips.
          TAG_VER="${GITHUB_REF_NAME:-}"
          if [[ "$TAG_VER" != v* && -n "${INPUT_TAG_NAME:-}" ]]; then
            TAG_VER="$INPUT_TAG_NAME"
          fi
          TAG_VER="${TAG_VER#v}"
          python3 - "$TAG_VER" <<'PYEOF'
          import re
          import sys

          tag_ver = sys.argv[1].strip()
          with open("CHANGELOG.md", "rb") as f:
              raw = f.read()
          if raw.startswith(b"\xef\xbb\xbf"):
              raw = raw[3:]
          text = raw.decode("utf-8", errors="ignore").replace("\r\n", "\n").replace("\r", "\n")

          sections = re.split(r"(?m)(?=^## )", text)
          picked = ""
          if tag_ver:
              pat = re.compile(r"^## .*?\bv?" + re.escape(tag_ver) + r"\b")
              for sec in sections:
                  if pat.search(sec):
                      picked = sec
                      break
          if not picked:
              for sec in sections:
                  if sec.startswith("## "):
                      picked = sec
                      break

          picked = re.sub(r"\n---\s*$", "", picked.strip())
          picked_ascii = picked.encode("ascii", "ignore").decode("ascii").strip()

          max_chars = 60000
          if len(picked_ascii) > max_chars:
              cut = picked_ascii[:59000].rsplit("\n", 1)[0].rstrip()
              picked_ascii = cut + "\n\n... (truncated; see full CHANGELOG.md inside package)"

          if picked_ascii:
              picked_ascii += "\n"

          with open(".release-changelog.md", "wb") as f:
              f.write(picked_ascii.encode("ascii"))
          PYEOF

          if [ ! -s ".release-changelog.md" ]; then
            echo "Extracted .release-changelog.md is empty." >&2
            exit 1
          fi
          CHAR_COUNT="$(wc -c < .release-changelog.md)"
          if [ "$CHAR_COUNT" -gt 120000 ]; then
            echo "Extracted .release-changelog.md exceeds 120,000 characters ($CHAR_COUNT)." >&2
            exit 1
          fi
          echo "Prepared .release-changelog.md ($CHAR_COUNT bytes)"

          SUITE_STAGE=".release/DynamicSuite"
          rm -rf ".release"
          mkdir -p "$SUITE_STAGE/Modules" "$SUITE_STAGE/Media/Icons" "$SUITE_STAGE/Fonts"

          cp DynamicSuite/DynamicSuite.toc "$SUITE_STAGE/DynamicSuite.toc"
          cp DynamicSuite/DynamicSuite_Core.lua "$SUITE_STAGE/DynamicSuite_Core.lua"
          cp DynamicSuite/DynamicSuite_UI.lua "$SUITE_STAGE/DynamicSuite_UI.lua"
          cp DynamicSuite/*.tga "$SUITE_STAGE/"
          cp DynamicSuite/Modules/Dynamic*.lua "$SUITE_STAGE/Modules/"
          cp DynamicSuite/Media/Icons/*.tga "$SUITE_STAGE/Media/Icons/"
          find DynamicSuite/Fonts -maxdepth 1 -type f ! -name 'Thumbs.db' ! -name '.DS_Store' ! -name '*.bak' ! -name '*.tmp' -exec cp {} "$SUITE_STAGE/Fonts/" \;
          cp DynamicSuite/CHANGELOG.md "$SUITE_STAGE/CHANGELOG.md"
          cp README.md "$SUITE_STAGE/README.md"

          # Verify every file referenced by DynamicSuite.toc exists in the staged folder
          while IFS= read -r entry || [ -n "$entry" ]; do
            entry="$(echo "$entry" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$entry" ] && continue
            case "$entry" in
              \#*) continue ;;
            esac
            entry_unix="${entry//\\//}"
            if [ ! -f "$SUITE_STAGE/$entry_unix" ]; then
              echo "Missing file listed in DynamicSuite.toc: $entry_unix" >&2
              exit 1
            fi
          done < "$SUITE_STAGE/DynamicSuite.toc"

          for req_asset in "icon.tga" "Media/Icons/icon_white.tga" "Media/Icons/icon_accent.tga" "CHANGELOG.md" "README.md"; do
            if [ ! -f "$SUITE_STAGE/$req_asset" ]; then
              echo "Missing required DynamicSuite asset: $req_asset" >&2
              exit 1
            fi
          done

          for forbidden in "AGENTS.md" "DESIGN_SYSTEM.md" "TASKS.md" "Design" "Packaging" "Marketing" "scripts" ".github"; do
            if [ -e "$SUITE_STAGE/$forbidden" ]; then
              echo "Forbidden dev/internal entry found in DynamicSuite stage: $forbidden" >&2
              exit 1
            fi
          done

      - name: Package & Release Full DynamicSuite (CurseForge 1804382)
        uses: BigWigsMods/packager@v2
        with:
          args: -c -o -p 1804382 -m .pkgmeta
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage standalone DynamicMarker addon
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR=".release/DynamicMarker"
          rm -rf ".release"
          mkdir -p "$STAGE_DIR/Media/Icons" "$STAGE_DIR/Fonts"

          cp Packaging/StandaloneTOCs/DynamicMarker.toc "$STAGE_DIR/DynamicMarker.toc"
          cp DynamicSuite/Modules/DynamicMarker.lua "$STAGE_DIR/DynamicMarker.lua"
          cp DynamicSuite/icon.tga "$STAGE_DIR/icon.tga"
          cp DynamicSuite/Media/Icons/*.tga "$STAGE_DIR/Media/Icons/"
          cp DynamicSuite/CHANGELOG.md "$STAGE_DIR/CHANGELOG.md"

          # Copy any bundled fonts explicitly referenced by DynamicMarker.lua
          { grep -oE 'Fonts\\+[^"\\|]+\.(ttf|otf|TTF|OTF)' DynamicSuite/Modules/DynamicMarker.lua || true; } \
            | sed 's/.*\\//' | sort -u | while IFS= read -r font; do
              [ -n "$font" ] || continue
              match="$(find DynamicSuite/Fonts -maxdepth 1 -iname "$font" -print -quit || true)"
              if [ -n "$match" ]; then
                cp "$match" "$STAGE_DIR/Fonts/"
              fi
            done
          rmdir "$STAGE_DIR/Fonts" 2>/dev/null || true

          # Verify every file referenced by DynamicMarker.toc exists in the staged folder
          while IFS= read -r entry || [ -n "$entry" ]; do
            entry="$(echo "$entry" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$entry" ] && continue
            case "$entry" in
              \#*) continue ;;
            esac
            entry_unix="${entry//\\//}"
            if [ ! -f "$STAGE_DIR/$entry_unix" ]; then
              echo "Missing file listed in DynamicMarker.toc: $entry_unix" >&2
              exit 1
            fi
          done < "$STAGE_DIR/DynamicMarker.toc"

          for req_asset in "icon.tga" "Media/Icons/icon_white.tga" "Media/Icons/icon_accent.tga" "CHANGELOG.md"; do
            if [ ! -f "$STAGE_DIR/$req_asset" ]; then
              echo "Missing required standalone asset: $req_asset" >&2
              exit 1
            fi
          done

      - name: Package & Release Standalone DynamicMarker (CurseForge 1331651)
        uses: BigWigsMods/packager@v2
        with:
          args: -c -o -p 1331651 -m Packaging/StandaloneTOCs/.pkgmeta-dynamicmarker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
